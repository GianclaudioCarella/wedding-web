<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accommodation Options</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fafafa;
      color: #1a1a1a;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header {
      text-align: center;
      padding: 40px 30px 30px;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #f0fdf4 100%);
    }
    .header-emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.02em;
    }
    .header-subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      color: #6a6a6a;
    }
    .content {
      padding: 40px 30px;
      line-height: 1.6;
    }
    .greeting {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    .message {
      font-size: 15px;
      color: #4a4a4a;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
    }
    .accommodation-item {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .accommodation-item:last-child {
      border-bottom: none;
    }
    .accommodation-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .accommodation-desc {
      font-weight: 400;
      color: #4b5563;
    }
    .accommodation-links {
      margin: 3px 0 0;
      font-size: 13px;
      color: #6b7280;
    }
    .accommodation-links a {
      color: #16a34a;
      text-decoration: none;
    }
    .accommodation-links a.directions-link {
      color: #2563eb;
    }
    .accommodation-note {
      margin-top: 6px;
      padding: 6px 10px;
      background-color: #fef9c3;
      border-left: 3px solid #eab308;
      border-radius: 4px;
      font-size: 13px;
      color: #713f12;
    }
    .closing-box {
      margin-top: 32px;
      padding: 20px;
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
      border-radius: 8px;
      text-align: center;
    }
    .closing-box p {
      margin: 0 0 8px;
      font-size: 15px;
      color: #4a4a4a;
    }
    .divider {
      height: 1px;
      background-color: #e5e5e5;
      margin: 30px 0;
    }
    .signature {
      font-size: 15px;
      color: #6a6a6a;
    }
    .signature-name {
      font-weight: 700;
      font-size: 18px;
      color: #1a1a1a;
      margin-top: 6px;
    }
    .footer {
      padding: 24px 30px;
      text-align: center;
      background-color: #f9f9f9;
      border-top: 1px solid #efefef;
      font-size: 13px;
      color: #6a6a6a;
    }
    .footer p {
      margin: 4px 0;
    }
    @media only screen and (max-width: 600px) {
      .container {
        margin: 20px;
        border-radius: 8px;
      }
      .content {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Gian &amp; Cat — October 3rd, 2026</h1>
      <p class="header-subtitle">La Garriga de Castelladral</p>
    </div>

    <div class="content">
      <div class="greeting">{{dear}} {{guestName}},</div>

      <div class="message">
        <p>{{intro1}}</p>
        <p>{{intro2}}</p>
      </div>

      <div class="section-title">{{accommodationTitle}}</div>

      {{accommodationList}}

      <div class="message" style="margin-top: 24px;">
        <p>{{helpText}}</p>
        <p>{{closing}}<br>{{closing2}}</p>
        <p>{{withLove}}<br><strong>{{couple}}</strong></p>
      </div>
    </div>

    <div class="footer">
    </div>
  </div>
</body>
</html>
