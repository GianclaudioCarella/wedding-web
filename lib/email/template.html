<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Confirmation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #fafafa;
      color: #1a1a1a;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
    }
    .header img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .content {
      padding: 40px 30px;
      line-height: 1.6;
    }
    .greeting {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a1a;
      letter-spacing: 0.02em;
    }
    .message {
      font-size: 16px;
      color: #4a4a4a;
      margin-bottom: 30px;
    }
    .event-details {
      margin: 30px 0;
    }
    .event-details h3 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #1a1a1a;
    }
    .event-details p {
      margin: 8px 0;
      color: #4a4a4a;
      font-size: 15px;
    }
    .event-details strong {
      color: #1a1a1a;
      font-weight: 600;
    }
    .footer {
      padding: 30px;
      text-align: center;
      background-color: #f9f9f9;
      border-top: 1px solid #efefef;
      font-size: 14px;
      color: #6a6a6a;
    }
    .footer p {
      margin: 5px 0;
    }
    .divider {
      height: 1px;
      background-color: #e5e5e5;
      margin: 30px 0;
    }
    @media only screen and (max-width: 600px) {
      .container {
        margin: 20px;
        border-radius: 8px;
      }
      .content {
        padding: 30px 20px;
      }
      .greeting {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="{{imageUrl}}" alt="Save the Date" style="max-width: 300px; width: 100%;" />
    </div>
    
    <div class="content">
      <div class="greeting">{{dear}} {{guestName}},</div>
      
      <div class="message">
        <p>🎉 <strong>{{thankYou}}</strong></p>
        <p>{{thrilled}}</p>
      </div>
      
      {{eventDetails}}
      
      <div class="message">
        <p>{{whatToExpect}}</p>
        <p>{{thanksRespond}}</p>
      </div>
      
      <div class="divider"></div>
      
      <div class="message" style="color: #6a6a6a; font-size: 15px;">
        <p>{{withLove}}</p>
        <p style="font-weight: 600; color: #1a1a1a; font-size: 18px; margin-top: 10px;">{{couple}}</p>
      </div>
    </div>
    
    <div class="footer">
      <p>{{automated}}</p>
      <p>{{questions}}</p>
      <p style="margin-top: 15px; font-size: 12px;">
        {{received}}
      </p>
    </div>
  </div>
</body>
</html>
